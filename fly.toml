# App name will be verified during launch. One Machine, one persistent volume.
app = "your-app-name"
primary_region = "lax"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "Dockerfile"

[env]
  AFTERHOURS_HOME = "/data"
  PUBLIC_ONLY = "true"
  PUBLIC_ORIGIN = "https://portfolio.example.org"
  EXECUTOR = "temporal"
  AGENT_RUNTIME = "deepagents"
  TEMPORAL_ADDRESS = "127.0.0.1:7233"
  TEMPORAL_TASK_QUEUE = "portfolio-public"
  MODEL_PROVIDER = "openai"
  OLLAMA_MODEL = "qwen3.8:27b"
  REDIRECT_HOSTS = ""
  OPENAI_MODEL = "gpt-5.5"
  OPENAI_MAX_OUTPUT_TOKENS = "2048"
  OPENAI_REASONING_EFFORT = "none"
  OLLAMA_CONTEXT = "16384"
  BRAIN_BACKEND = "files"
  WEB_SEARCH_PROVIDER = "openai"
  PUBLIC_DAILY_TURNS = "50"
  PUBLIC_DAILY_MODEL_CALLS = "150"
  LANGSMITH_TRACING = "false"

[[mounts]]
  source = "portfolio_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "45s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"

[[restart]]
  policy = "always"
