[project]
name = "personal-agent-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1,<2",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "temporalio>=1.35,<2",
    "langchain-ollama>=1,<2",
    "ddgs>=9.16,<10",
    "lxml>=6,<7",
    "deepagents==0.7.32",
    "temporalio-deepagents==0.0.3",
    "mcp==2.3.0",
    "websockets>=15,<18",
    "PyJWT[crypto]>=2.15,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
